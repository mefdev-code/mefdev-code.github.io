  <script><![CDATA[
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const ink = document.getElementById('ink')
      const outline = ink.getAttribute('d')
      const coords = outline.match(/-?\d+(?:\.\d+)?/g).map(Number)
      const points = [[coords[0], coords[1]]]
      const controls = []
      for (let i = 2; i < coords.length; i += 4) {
        controls.push([coords[i], coords[i + 1]])
        points.push([coords[i + 2], coords[i + 3]])
      }

      // The exported outline walks to the pen tip on one edge and back on the other.
      const tip = 257
      const left = points.slice(0, tip + 1)
      const right = points.slice(tip).reverse()
      const stride = right.length
      const costs = new Float64Array(left.length * stride).fill(Infinity)
      const parents = new Uint8Array(costs.length)
      const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1])
      for (let i = 0; i < left.length; i++) {
        for (let j = 0; j < right.length; j++) {
          const index = i * stride + j
          const diagonal = i && j ? costs[index - stride - 1] : Infinity
          const up = i ? costs[index - stride] : Infinity
          const across = j ? costs[index - 1] : Infinity
          const best = Math.min(diagonal, up, across)
          costs[index] = distance(left[i], right[j]) + (index ? best : 0)
          parents[index] = best === diagonal ? 0 : best === up ? 1 : 2
        }
      }

      const pairs = []
      let i = left.length - 1
      let j = right.length - 1
      while (i || j) {
        pairs.push([i, j])
        const direction = parents[i * stride + j]
        if (direction !== 2) i--
        if (direction !== 1) j--
      }
      pairs.push([0, 0])
      pairs.reverse()

      let length = 0
      const frames = pairs.map(([a, b], index) => {
        if (index) {
          const [previousA, previousB] = pairs[index - 1]
          length += (distance(left[a], left[previousA]) + distance(right[b], right[previousB])) / 2
        }
        return length
      })
      const forward = controls.slice(0, tip).map((control, index) => 'Q' + control + ' ' + points[index + 1])
      const backward = controls.slice(tip).map((control, index) => 'Q' + control + ' ' + points[tip + index + 1])
      const pace = [[0, 0], [.10, 0], [.22, .12], [.31, .28], [.48, .46], [.58, .54], [.62, .55], [.79, .76], [1, 1]]
      let start
      let frame = 0
      ink.setAttribute('d', '')

      function draw(now) {
        start ??= now
        const elapsed = Math.min((now - start) / 850, 1)
        if (elapsed === 1) {
          ink.setAttribute('d', outline)
          return
        }
        const next = pace.findIndex(([time]) => time > elapsed)
        const [fromTime, fromProgress] = pace[next - 1]
        const [toTime, toProgress] = pace[next]
        const progress = fromProgress + (toProgress - fromProgress) * (elapsed - fromTime) / (toTime - fromTime)
        while (frame + 1 < frames.length && frames[frame + 1] <= progress * length) frame++
        if (progress > 0 && frame > 0) {
          const [a, b] = pairs[frame]
          ink.setAttribute('d', 'M' + left[0] + forward.slice(0, a).join('') +
            'L' + right[b] + backward.slice(backward.length - b).join('') + 'Z')
        }
        requestAnimationFrame(draw)
      }
      requestAnimationFrame(draw)
    }
  ]]></script>
</svg>
